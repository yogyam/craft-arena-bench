name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "submissions/**"
      - "results/**"
      - "replays/**"
      - "duels/**"
      - "flags.json"
  pull_request:
    paths-ignore:
      - "submissions/**"
      - "results/**"
      - "replays/**"
      - "duels/**"
      - "flags.json"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --quiet ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  # The harness tests need no server. Linux and macOS are what the maintainers run on.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --quiet ".[dev]"
      - run: pytest -q

  body:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
        working-directory: body
      - run: npm test
        working-directory: body
