# Runs on every pull request that touches submissions/. It has no secrets. It checks that the manifest is well
# formed, that the manifest names the person opening the pull request, that they are within the limits, that the
# endpoint is not another entry's, and that the endpoint answers the health check with the current interface
# version. Values from the pull request reach the shell only through environment variables.
name: Check submission

on:
  pull_request:
    paths:
      - "submissions/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install --quiet --require-hashes -r requirements.lock
          pip install --quiet --no-deps .

      - name: Refuse changes outside submissions/
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          other=$(git diff --name-only "$BASE" "$HEAD" | grep -v '^submissions/' || true)
          if [ -n "$other" ]; then
            echo "A submission pull request may only change files under submissions/. Also changed:"
            echo "$other"
            exit 1
          fi

      - name: Verify the submissions this pull request changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
          PR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          folders=()
          while IFS= read -r folder; do
            if [[ "$folder" =~ ^submissions/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              folders+=("$folder")
            else
              echo "Not a submission folder: $folder"
              exit 1
            fi
          done < <(git diff --name-only "$BASE" "$HEAD" -- submissions/ | awk -F/ 'NF >= 3 { print $1 "/" $2 }' | sort -u)
          if [ "${#folders[@]}" -eq 0 ]; then
            echo "No submission changed"
            exit 0
          fi
          craft-arena-bench verify-submission --submissions submissions --github-login "$PR_LOGIN" --exempt yogyam "${folders[@]}"
