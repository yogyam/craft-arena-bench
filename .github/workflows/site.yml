# Rebuilds the website when results or the site code change on main.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "duels/**"
      - "replays/**"
      - "submissions/**"
      - "src/craft_arena_bench/service/site.py"
      - "src/craft_arena_bench/service/replay.html"
      - "src/craft_arena_bench/service/replay.js"
      - "flags.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install --quiet --require-hashes -r requirements.lock
          pip install --quiet --no-deps .

      - name: Build
        run: craft-arena-bench build-site --submissions submissions --duels duels --replays replays --output site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
