[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "craft-arena-bench"
dynamic = ["version"]
description = "An AI-vs-AI benchmark for Minecraft decision models: fixed decision rates, endpoint entrants, a rated leaderboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Yogya Mehrotra", email = "ymehrotra@ucsd.edu" }]
keywords = ["benchmark", "minecraft", "mineflayer", "decision-models", "leaderboard"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx",        # endpoint client
    "websockets",   # bridge to the body
    "numpy",        # rating
]

[project.urls]
Repository = "https://github.com/yogyam/craft-arena-bench"
Issues = "https://github.com/yogyam/craft-arena-bench/issues"
Changelog = "https://github.com/yogyam/craft-arena-bench/blob/main/CHANGELOG.md"

[project.scripts]
craft-arena-bench = "craft_arena_bench.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.dynamic]
version = { attr = "craft_arena_bench.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",    # Line length is the formatter's business
    "SIM115",  # Plain open() calls read fine in this codebase
    "SIM108",  # An if/else is often clearer than a conditional expression
    "SIM102",  # Nested ifs are allowed where they read better
]
