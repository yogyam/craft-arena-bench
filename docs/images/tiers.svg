<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <style>
    .t { fill: #52514e; } .h { font-weight: 700; fill: #0b0b0b; font-size: 14px; }
    .tick { stroke: #c3c2b7; stroke-width: 1; }
    .ask { fill: #2a78d6; } .budget { fill: #d5e5f9; stroke: #2a78d6; stroke-width: 1; }
    .reflex { fill: #e1e0d9; }
  </style>
  <text x="20" y="28" class="h">One second of play: 20 game ticks. The body acts on every tick; the model is asked at the tier's rate.</text>
  <!-- tick ruler -->
  <g id="ruler">
    <line x1="160" y1="60" x2="880" y2="60" stroke="#52514e" stroke-width="1.5"/>
    <text x="160" y="52" class="t" font-size="11">tick 0</text>
    <text x="520" y="52" class="t" font-size="11" text-anchor="middle">500 ms</text>
    <text x="880" y="52" class="t" font-size="11" text-anchor="end">1000 ms</text>
  </g>
  <!-- body row -->
  <text x="20" y="92" class="h">Body, 20 Hz</text>
  <text x="20" y="108" class="t" font-size="11.5">aim, swing, dodge, guards</text>
  <g>
    <rect x="160" y="80" width="34" height="18" class="reflex"/><rect x="196" y="80" width="34" height="18" class="reflex"/><rect x="232" y="80" width="34" height="18" class="reflex"/><rect x="268" y="80" width="34" height="18" class="reflex"/><rect x="304" y="80" width="34" height="18" class="reflex"/><rect x="340" y="80" width="34" height="18" class="reflex"/><rect x="376" y="80" width="34" height="18" class="reflex"/><rect x="412" y="80" width="34" height="18" class="reflex"/><rect x="448" y="80" width="34" height="18" class="reflex"/><rect x="484" y="80" width="34" height="18" class="reflex"/><rect x="520" y="80" width="34" height="18" class="reflex"/><rect x="556" y="80" width="34" height="18" class="reflex"/><rect x="592" y="80" width="34" height="18" class="reflex"/><rect x="628" y="80" width="34" height="18" class="reflex"/><rect x="664" y="80" width="34" height="18" class="reflex"/><rect x="700" y="80" width="34" height="18" class="reflex"/><rect x="736" y="80" width="34" height="18" class="reflex"/><rect x="772" y="80" width="34" height="18" class="reflex"/><rect x="808" y="80" width="34" height="18" class="reflex"/><rect x="844" y="80" width="34" height="18" class="reflex"/>
  </g>
  <!-- 5 Hz -->
  <text x="20" y="150" class="h">5 Hz tier</text>
  <text x="20" y="166" class="t" font-size="11.5">asked every 4 ticks, 150 ms to answer</text>
  <g>
    <rect x="160" y="138" width="108" height="18" class="budget"/><circle cx="160" cy="147" r="5" class="ask"/>
    <rect x="304" y="138" width="108" height="18" class="budget"/><circle cx="304" cy="147" r="5" class="ask"/>
    <rect x="448" y="138" width="108" height="18" class="budget"/><circle cx="448" cy="147" r="5" class="ask"/>
    <rect x="592" y="138" width="108" height="18" class="budget"/><circle cx="592" cy="147" r="5" class="ask"/>
    <rect x="736" y="138" width="108" height="18" class="budget"/><circle cx="736" cy="147" r="5" class="ask"/>
  </g>
  <!-- 2 Hz -->
  <text x="20" y="208" class="h">2 Hz tier</text>
  <text x="20" y="224" class="t" font-size="11.5">asked every 10 ticks, 400 ms to answer</text>
  <g>
    <rect x="160" y="196" width="288" height="18" class="budget"/><circle cx="160" cy="205" r="5" class="ask"/>
    <rect x="520" y="196" width="288" height="18" class="budget"/><circle cx="520" cy="205" r="5" class="ask"/>
  </g>
  <!-- 1 Hz -->
  <text x="20" y="266" class="h">1 Hz tier</text>
  <text x="20" y="282" class="t" font-size="11.5">asked every 20 ticks, 900 ms to answer</text>
  <g>
    <rect x="160" y="254" width="648" height="18" class="budget"/><circle cx="160" cy="263" r="5" class="ask"/>
  </g>
  <text x="20" y="316" class="t">● the model is asked   ▭ time it has to answer; a late answer is dropped and the previous intent carries on.</text>
  <text x="20" y="336" class="t">Ratings are per tier, so a laptop model and a datacentre model are compared at the same decision rate.</text>
</svg>
